# btrbk configuration — REFERENCE EXAMPLE ONLY.
#
# This file is installed under the script directory for reference. It is NOT
# read at runtime: the canonical config is /etc/btrbk/btrbk.conf, generated by
# `btrdasd setup --upgrade` from /etc/das-backup/config.toml. Edit config.toml
# and re-run setup — never hand-edit either btrbk.conf.
#
# Every name below (volumes, labels, mount points, subvolumes) is illustrative.
# Device letters are deliberately NOT used: USB re-enumeration reorders them,
# so targets are identified by label or UUID (see docs/DAS-BAY-MAPPING.md).
# Version: 1.2.0
# Date: 2026-10-23
#
# This example backs up to two DAS drives:
#   Drive 1 (by label): system backup - the root volume's and a second SSD's subvolumes
#   Drive 2 (by label): data backup - a data volume's subvolumes
#
# Usage:
#   sudo btrbk -c /etc/btrbk/btrbk.conf run
#   sudo btrbk -c /etc/btrbk/btrbk.conf dryrun  # preview only
#
# Prerequisites:
#   1. Mount top-level subvolumes (backup-run.sh does this automatically):
#      mount -o subvolid=5 /dev/nvme0n1p2 /.btrfs-nvme
#      mount -o subvolid=5 LABEL=<ssd-label> /.btrfs-ssd
#      mount -o subvolid=5 UUID=<data-volume-uuid> /.btrfs-data
#   2. Mount DAS backup drives:
#      mount LABEL=das-backup-system /mnt/backup-system
#      mount LABEL=das-backup-data /mnt/backup-data

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================

# Transaction log for tracking operations
transaction_log         /var/log/btrbk.log

# Use mbuffer for buffered transfers with progress
stream_buffer           256m

# Compression for send streams (reduces I/O, good for SMR drives)
stream_compress         zstd

# Lock file to prevent concurrent runs
lockfile                /var/lock/btrbk.lock

# ============================================================================
# RETENTION POLICY
# ============================================================================

# Source snapshots (on live system) - keep minimal, these are for send reference
snapshot_preserve_min   latest
snapshot_preserve       2d

# Target snapshots (on backup drives) - this is the actual backup history
target_preserve_min     latest
target_preserve         4w 2m

# ============================================================================
# DRIVE 1: SYSTEM BACKUP (NVMe + SSD subvolumes)
# Target: LABEL=das-backup-system mounted at /mnt/backup-system
# ============================================================================

# --- NVMe Subvolumes ---
volume /.btrfs-nvme
  snapshot_dir          .btrbk-snapshots
  target                /mnt/backup-system/nvme

  # Root filesystem
  subvolume             @
    snapshot_name       root

  # Home directory
  subvolume             @home
    snapshot_name       home

  # Root user home
  subvolume             @root
    snapshot_name       root-home

  # System logs
  subvolume             @log
    snapshot_name       log

# --- SSD Subvolumes ---
volume /.btrfs-ssd
  snapshot_dir          .btrbk-snapshots
  target                /mnt/backup-system/ssd

  # /opt - applications
  subvolume             @opt
    snapshot_name       opt

  # /srv - services data
  subvolume             @srv
    snapshot_name       srv

# ============================================================================
# DRIVE 2: DATA BACKUP
# Target: LABEL=das-backup-data mounted at /mnt/backup-data
# ============================================================================

# --- Projects ---
volume /.btrfs-data
  snapshot_dir          Projects/.btrbk-snapshots
  target                /mnt/backup-data/projects

  subvolume             Projects
    snapshot_name       projects

# --- Media (irreplaceable originals) ---
volume /.btrfs-data
  snapshot_dir          Media/.btrbk-snapshots
  target                /mnt/backup-data/media

  # btrfs send does not descend into nested subvolumes: a re-derivable
  # directory inside Media is still sent unless it is its own subvolume.
  subvolume             Media
    snapshot_name       media

# ============================================================================
# NOTES
# ============================================================================
#
# What gets backed up:
#   Drive 1: NVMe @, @home, @root, @log; SSD @opt, @srv
#   Drive 2: Projects, Media
#
# What is typically NOT backed up (left out of the config, or excluded with
# [subvolumes].exclude in config.toml):
#     - re-derivable data (transcodes, caches, re-downloadable libraries)
#     - VM images recreatable from installation media
#     - /var/cache (rebuilt automatically)
