<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/busconfig/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the bus name -->
  <policy user="root">
    <allow own="org.dasbackup.Helper1"/>
    <!-- Before it owns the name, the helper proves its dispatch task is live
         by introspecting its own object at its unique name (bd 3i1); that
         destination owns no name yet, so the rule below does not cover it,
         and dbus-broker denies the call without this one. -->
    <allow send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  </policy>

  <!-- Any user can call methods (polkit handles authorization) -->
  <policy context="default">
    <allow send_destination="org.dasbackup.Helper1"/>
    <allow receive_sender="org.dasbackup.Helper1"/>
  </policy>
</busconfig>
