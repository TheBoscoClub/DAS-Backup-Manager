# cargo-mutants configuration.
#
# Run from indexer/, then score the run — cargo-mutants' own exit code is not
# a result (it is 0 when every mutant was unviable, too):
#
#   git diff --relative origin/main -- . > mutants.diff
#   env -u CARGO_TARGET_DIR cargo mutants --in-place --no-shuffle --in-diff mutants.diff
#   env -u CARGO_TARGET_DIR python3 ../.github/scripts/mutants-gate.py
#
# CI does the same on every push, plus a weekly full-scope pass:
# .github/workflows/mutants.yml.
#
# --in-place is REQUIRED in this crate. Without it cargo-mutants copies only the
# crate directory, `setup/templates.rs`'s include_str!("../../../scripts/*.sh")
# cannot resolve, and the run exits 0 having tested NOTHING — reporting success
# for zero work done. It mutates the working tree and restores it afterwards.
# Run it on a COPY of the repo: besides uncommitted work being at risk, one
# restore.rs mutant removes a destination check and the tests then restore
# their fixture files (a.txt, payload.txt, link, ...) into the crate directory.
#
# The diff must be crate-relative (`--relative`, from indexer/). A repo-relative
# one lists 0 mutants. Do not pass `-- --lib`: it skips the bin and integration
# tests, and with them the tests that catch mutants in src/setup/.

# Mutants deliberately not tested, each with a reason. This list is not a place
# to park inconvenient failures: everything here must be untestable in principle,
# not merely awkward.
exclude_re = [
    # `signalable_pid` refuses pid 0 because `kill(-0, SIGINT)` is
    # `kill(0, SIGINT)`: the caller's own process group. Replacing the whole
    # body with `Ok(Default::default())` (pid 0) makes every test that
    # interrupts a real child signal the test run itself — cargo-mutants
    # included — so the run dies instead of failing an assertion. The guard's
    # own mutants (`> 0`, the fit check) and the refusal of 0 are tested.
    "replace signalable_pid -> io::Result<libc::pid_t> with Ok\\(Default::default\\(\\)\\)",
    # `Drop for Database` issues `PRAGMA optimize` on close. SQLite exposes no
    # observable result from it — no return value, no state change a query can
    # see — so there is no assertion that distinguishes the real impl from an
    # empty one. Deleting the body would be a real (if minor) regression, which
    # is why it stays; it simply cannot be covered by a test.
    "<impl Drop for Database>::drop",
    # `apply_udev_rules` reloads the host's udev rules and re-triggers every
    # block device. Its only effect is on the running system's udev state,
    # which needs root and cannot be observed from a unit test. The command
    # runner it calls, `run_udevadm`, is mutated and tested.
    "replace apply_udev_rules with \\(\\)",
    # `install` and `check` are the root-only entry points behind `btrdasd
    # setup`, which exits unless it is run as root. `install` writes under `/`
    # and enables the host's timers; `check` reads `/etc/das-backup` and prints
    # to stdout. Neither can be called from a test without changing or
    # depending on the host. Only the whole-body replacement is excluded: the
    # logic they call (`install_to_prefix`, `install_schedule`, `check_with`,
    # `udisks_report`, `command_stdout`) is mutated and tested.
    "replace install -> Result<\\(\\), Box<dyn std::error::Error>> with Ok\\(\\(\\)\\)",
    "replace check -> Result<\\(\\), Box<dyn std::error::Error>> with Ok\\(\\(\\)\\)",
    # `uninstall` and `uninstall_all` are the other two root-only entry points
    # behind `btrdasd setup`, and the same reasoning applies. Each is only the
    # binding of its core to the host — `/etc/das-backup`, `/` and the real
    # `systemctl` — so calling one from a test would remove the live install
    # and stop this host's timers. Only the whole-body replacement is excluded:
    # the cores they call (`uninstall_with`, `uninstall_all_with`) take their
    # paths and their systemctl runner as arguments and are mutated and tested,
    # and `setup::dispatch` drives them through its `SetupHost` seam. (`upgrade`
    # returns a `SetupOutcome`, which has no default, so it yields no viable
    # whole-body mutant to exclude; the refusal's exit status is `exit_status`,
    # tested.)
    "replace uninstall -> Result<\\(\\), Box<dyn std::error::Error>> with Ok\\(\\(\\)\\)",
    "replace uninstall_all -> Result<\\(\\), Box<dyn std::error::Error>> with Ok\\(\\(\\)\\)",
    # `delete_subvolume` is the spawn of `btrfs subvolume delete` and nothing
    # else: its only effect is a subvolume removed from a mounted BTRFS
    # filesystem, which needs root and a real filesystem to observe. Only the
    # whole-body replacement is excluded: the command it builds
    # (`delete_command`) and its reading of the result (`delete_outcome`) are
    # mutated and tested.
    "replace delete_subvolume -> Result<\\(\\), String> with Ok\\(\\(\\)\\)",
    # `detect_subvolumes` runs `btrfs subvolume list /`, which the kernel
    # answers only for root and only on a host whose `/` is BTRFS. Run from a
    # test it fails and returns the same empty list the mutant does, so no
    # unprivileged, host-independent assertion can tell the two apart. Only
    # the whole-body replacement is excluded: the code it is made of
    # (`successful_stdout`, `parse_subvolume_output`) is mutated and tested.
    "replace detect_subvolumes -> Vec<SubvolumeInfo> with vec!\\[\\]",
    # `perform_drift_check` is the drift check's host shell: it mounts the
    # source volumes, lists them, hands the listings to `drift_from_listings`
    # and unmounts. That needs root and real BTRFS volumes, so no unprivileged
    # test can tell the real body from an empty report. Only the whole-body
    # replacement is excluded. The shell must stay free of logic: everything
    # that decides what is missing, stale or unreadable lives in
    # `drift_from_listings`, which is mutated and tested.
    "replace perform_drift_check -> DriftReport with Default::default\\(\\)",
    # `btrfs_uuid_for_serial` binds its core to the host: the real
    # `/dev/disk/by-id` lookup and the real `blkid`. A test can only tell it
    # from `None` with a real drive attached. Only the whole-body replacement
    # is excluded: `btrfs_uuid_for_serial_with` and `btrfs_uuid_of_with` are
    # mutated and tested with scripted answers.
    "replace btrfs_uuid_for_serial -> Option<String> with None",
    # `device_for_fs_uuid` is the same kind of binding: `blkid -U` on the
    # real host. Its one host test needs a root filesystem with a UUID and
    # returns early in a container, so in CI nothing could tell these apart.
    # Every decision is in `device_for_fs_uuid_with` (empty UUID, exit
    # status, blank or non-device answer), mutated and tested with scripted
    # answers. All three whole-body replacements are excluded.
    "replace device_for_fs_uuid -> Option<String> with ",
    # `create_snapshots`, `send_snapshots`, `run_full_pipeline` and `archive_boot`
    # (src/backup.rs) are each one line: the `_with` core handed `SystemRunner`
    # and `StepEnv::HOST` — the real btrbk, the real mount table and the real
    # target check. Calling one from a test would run btrbk or btrfs on this
    # host, which no test may do, so nothing can tell the real body from
    # `Ok(0)`. Only the whole-body replacements are excluded: the cores
    # (`create_snapshots_with`, `send_snapshots_with`, `run_full_pipeline_with`,
    # `archive_boot_with`) are mutated and tested against a scripted runner,
    # and `the_host_environment_runs_real_commands_and_verifies_for_real`
    # pins what `HOST` is made of. bd DAS-Backup-Manager-thi.
    "replace create_snapshots -> Result<usize, Box<dyn std::error::Error>> with Ok\\(",
    "replace send_snapshots -> Result<\\(usize, u64\\), Box<dyn std::error::Error>> with Ok\\(",
    "replace run_full_pipeline -> Result<\\(usize, usize, usize, u64\\), Box<dyn std::error::Error>> with Ok\\(",
    "replace archive_boot -> Result<bool, Box<dyn std::error::Error>> with Ok\\(",
    # `sync_targets` is `syncfs(2)` on each target's filesystem, so that the
    # `statvfs` reading behind `bytes_sent` is not stale. Its only effect is the
    # kernel committing a transaction early; nothing a test can read changes
    # (the reading itself is `used_bytes`, mutated and tested, and the order of
    # sync and reading is `synced_target_usage`'s, which the host test calls).
    "replace sync_targets with \\(\\)",
    # `index_mounted_targets` binds `index_targets_with` to the real mount
    # lookup and the real `indexer::walk`, which would walk this host's mounted
    # targets: no test may. The core is mutated and tested with a scripted
    # mount lookup and walk, and `run_backup_with` is tested against a scripted
    # `StepEnv::index`. Only the whole-body replacement is excluded.
    "replace index_mounted_targets -> bool with ",
]

# The D-Bus helper (`src/bin/btrdasd-helper.rs`) is built only with
# `--features dbus`, and these runs build without features: a mutant there is
# never compiled, the unmutated tests pass, and it is scored "missed" without
# having been tested at all. Building with `--features dbus` would compile it
# but still not test it: what remains in the helper is D-Bus glue — polkit
# calls, signal emission, `#[interface]` methods — that needs a live system bus,
# and the ~150 mutants there (measured with `cargo mutants --list --features dbus
# --file src/bin/btrdasd-helper.rs` before this exclusion) would survive by construction. So the
# file is excluded whole, and the rule is the other half of the bargain: logic
# does not live in the helper. Its decisions are library functions, mutated
# here — `backup::run_backup_job` (the whole GUI backup), `backup::sync_before_backup`,
# `progress::OrderedProgress` (event order, one JobFinished),
# `mount::fail_if_still_mounted`, `btrbk_conf::refuse_moving_btrbk_conf_from`,
# `btrbk_conf::save_config_and_btrbk_conf`. bd DAS-Backup-Manager-h4t.
exclude_globs = ["src/bin/btrdasd-helper.rs"]
