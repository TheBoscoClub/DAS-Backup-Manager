[package]
name = "buttered-dasd"
version = "0.7.23"  # 0.7.23.x tags — Cargo semver forbids 4-segment versions; btrdasd --version reports CMakeLists.txt's
edition = "2024"
description = "ButteredDASD — content indexer for DAS backup snapshots with SQLite FTS5 span-based storage"
license = "MIT"

[lib]
name = "buttered_dasd"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "btrdasd"
path = "src/main.rs"

[[bin]]
name = "btrdasd-helper"
path = "src/bin/btrdasd-helper.rs"
required-features = ["dbus"]

[features]
default = []
dbus = ["dep:zbus", "dep:tokio"]
# Reads the DAS_SCRUB_STATE / DAS_BTRFS_STATUS_DIR overrides. Off in every
# shipped build; the dev-dependency below turns it on for tests only.
test-overrides = []

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
walkdir = "2.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", features = ["preserve_order"] }  # key order kept: a key a config save inserts is written in field order
# config.toml saves are byte splices at the spans toml_edit's Document keeps:
# keys this binary does not know, comments and layout survive every save (bd
# DAS-Backup-Manager-28il, DAS-Backup-Manager-5237.4).
toml_edit = "0.25"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"
libc = "0.2"
serde_json = "1"
zbus = { version = "6", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
buttered-dasd = { path = ".", features = ["test-overrides"] }
tempfile = "3"
filetime = "0.2"
# The helper's interface test serves it over a socket pair, not a bus: only
# `p2p` builds that (bd DAS-Backup-Manager-o3zk). Tests only.
zbus = { version = "6", default-features = false, features = ["tokio", "p2p"] }
