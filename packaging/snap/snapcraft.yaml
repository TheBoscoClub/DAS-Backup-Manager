name: das-backup-manager
version: '0.7.24.0'
summary: DAS backup manager with btrbk, SQLite FTS5, KDE GUI
description: |
  ButteredDASD manages BTRFS-based backups to DAS (Direct Attached Storage)
  enclosures. Config-driven backup orchestration via btrbk, full-text content
  indexing with SQLite FTS5, and a KDE Plasma 6 GUI for browsing and restoring
  files from backup snapshots.
confinement: classic
base: core24
grade: stable

parts:
  btrdasd:
    plugin: rust
    source: .
    source-subdir: indexer
    build-packages:
      - cargo
      - rustc

  gui-and-scripts:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DBUILD_INDEXER=OFF
      # The helper is a root D-Bus service the host installs; the Flatpak and
      # the AppImage leave it out as well, and this part has no Rust toolchain.
      - -DBUILD_HELPER=OFF
    build-packages:
      - extra-cmake-modules
      - g++
      - qt6-base-dev
      - libkf6coreaddons-dev
      - libkf6i18n-dev
      - libkf6xmlgui-dev
      - libkf6colorscheme-dev
      - libkf6configwidgets-dev
      - libkf6iconthemes-dev
      - libkf6crash-dev
      - libkf6kio-dev
      - libkf6notifications-dev
      - libkf6statusnotifieritem-dev
      - libqt6charts6-dev
    stage-packages:
      - btrbk
      - btrfs-progs
      - smartmontools
      - bash
      - libqt6core6t64
      - libqt6widgets6t64
      - libqt6dbus6t64
      - libqt6charts6t64
      - libkf6coreaddons6t64
      - libkf6i18n6t64
      - libkf6xmlgui6t64
      - libkf6colorscheme6t64
      - libkf6configwidgets6t64
      - libkf6iconthemes6t64
      - libkf6crash6t64
      - libkf6kio6t64
      - libkf6notifications6t64
      - libkf6statusnotifieritem6t64
      - util-linux
      - s-nail

apps:
  btrdasd:
    # The rust plugin runs cargo install --root, which puts binaries in bin/;
    # only the cmake part (the GUI) installs under usr/.
    command: bin/btrdasd
  # The recovery-drive console opens TigerVNC's vncviewer on the host; inside this
  # sandbox the GUI shows the console socket's path instead (8249 stage 3).
  btrdasd-gui:
    command: usr/bin/btrdasd-gui
    desktop: usr/share/applications/org.theboscoclub.btrdasd-gui.desktop
