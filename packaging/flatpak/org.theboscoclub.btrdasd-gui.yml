app-id: org.theboscoclub.btrdasd-gui
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# No Rust SDK extension: the GUI is built alone (BUILD_INDEXER and BUILD_HELPER
# are OFF below), so nothing here runs cargo, and the extension is 2 GB of disk.
command: btrdasd-gui
# The recovery-drive console opens TigerVNC's vncviewer on the host; inside this
# sandbox the GUI shows the console socket's path instead (8249 stage 3).

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # D-Bus access to btrdasd-helper for privileged operations
  - --system-talk-name=org.dasbackup.Helper1
  # Read-only access to home for locating the backup SQLite database
  - --filesystem=home:ro
  # Read-only access to /var/lib/das-backup for default DB location
  - --filesystem=/var/lib/das-backup:ro

modules:
  # Qt Charts comes with the KDE runtime and SDK (the same Qt as the rest), so
  # it is no module here; a copy built from source at another version would
  # not match the Qt it links.
  - name: btrdasd-gui
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_GUI=ON
      - -DBUILD_INDEXER=OFF
      - -DBUILD_HELPER=OFF
    sources:
      # Use the local checkout so releases build from the tagged tree without
      # needing to round-trip through GitHub's archive endpoint (which would
      # require pinning a sha256 per release). Path is relative to this manifest.
      - type: dir
        path: ../..
