# live-sync manifest. `live <dir>` (host is authority, read-only view) or `repo <dir>` (this checkout edits it).
# `live-sync audit` reports anything on NVMe the project depends on without listing it here.
#
# esp-sync.sh and esp-mirror.hook (bd DAS-Backup-Manager-he59, yjyp): the one canonical host copy is
# /usr/local/lib/das-backup-manager/, root-owned; /usr/local/bin/esp-sync.sh and /etc/pacman.d/hooks/esp-mirror.hook
# are symlinks into it. pacman runs the script as root, so the entry is `live` (a `repo` directory is owned by the
# project owner, and root never executes a file the owner can write). Change the files on the host as root; the
# checkout's live/ view shows them and the commit records them.
# pacman reads a symlinked .hook as a file, and a DANGLING one fails every transaction ("could not stat file",
# "failed to run transaction hooks"; proven on test-vm-cachyos 2026-10-20): never remove this directory while the
# links exist.
live /usr/local/lib/das-backup-manager
