name: Build Release Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g. 0.7.12-test)'
        required: true
        default: '0.7.12-test'

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # ===========================================================================
  # Arch Linux (.pkg.tar.zst)
  # ===========================================================================
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm base-devel rust cmake extra-cmake-modules \
            qt6-base qt6-charts kcoreaddons ki18n kxmlgui kconfigwidgets \
            kiconthemes kcrash kio knotifications kstatusnotifieritem \
            qt6-tools

      - name: Build package
        env:
          VERSION_TAG: ${{ env.VERSION }}
        run: |
          VERSION_NUM="${VERSION_TAG#v}"
          # Arch pkgver forbids hyphens — sanitize for test/RC versions
          PKGVER_SAFE="${VERSION_NUM//-/_}"
          # makepkg refuses to run as root — create a build user
          useradd -m builder
          chown -R builder: .
          # Update PKGBUILD: pin pkgver to the release version, use local checkout
          sed -i "s|^pkgver=.*|pkgver=${PKGVER_SAFE}|" packaging/arch/PKGBUILD
          sed -i "s|source=.*|source=()|" packaging/arch/PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=()|" packaging/arch/PKGBUILD
          sed -i "s|cd \"DAS-Backup-Manager-\$pkgver\"|cd \"\$GITHUB_WORKSPACE\"|g" packaging/arch/PKGBUILD
          su builder -c 'cd packaging/arch && makepkg -sf --noconfirm'

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  # ===========================================================================
  # Debian (.deb)
  # ===========================================================================
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl build-essential cmake extra-cmake-modules debhelper \
            qt6-base-dev qt6-charts-dev libkf6coreaddons-dev libkf6i18n-dev libkf6xmlgui-dev \
            libkf6configwidgets-dev libkf6iconthemes-dev libkf6crash-dev libkf6kio-dev \
            libkf6notifications-dev libkf6statusnotifieritem-dev

      - name: Install rustup (trixie's rustc 1.85 is too old for let-chains and zbus 5.14)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build .deb
        run: |
          cp -r packaging/debian .
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../*.deb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: debian-package
          path: dist/*.deb

  # ===========================================================================
  # Fedora (.rpm)
  # ===========================================================================
  fedora:
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install build dependencies
        run: |
          dnf install -y rust cargo cmake extra-cmake-modules gcc-c++ rpm-build \
            qt6-qtbase-devel qt6-qtcharts-devel kf6-kcoreaddons-devel kf6-ki18n-devel kf6-kxmlgui-devel \
            kf6-kconfigwidgets-devel kf6-kiconthemes-devel kf6-kcrash-devel kf6-kio-devel \
            kf6-knotifications-devel kf6-kstatusnotifieritem-devel

      - name: Build RPM
        env:
          VERSION_TAG: ${{ env.VERSION }}
        run: |
          VERSION_NUM="${VERSION_TAG#v}"
          # RPM Version: tag forbids hyphens — sanitize for test/RC versions
          RPMVER_SAFE="${VERSION_NUM//-/_}"
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar czf ~/rpmbuild/SOURCES/das-backup-manager-${RPMVER_SAFE}.tar.gz \
            --transform "s,^\.,DAS-Backup-Manager-${RPMVER_SAFE}," .
          cp packaging/fedora/das-backup-manager.spec ~/rpmbuild/SPECS/
          sed -i "s/^Version:.*/Version:        ${RPMVER_SAFE}/" ~/rpmbuild/SPECS/das-backup-manager.spec
          rpmbuild -ba ~/rpmbuild/SPECS/das-backup-manager.spec

      - name: Collect RPMs
        run: |
          mkdir -p dist
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: fedora-package
          path: dist/*.rpm

  # ===========================================================================
  # AppImage (GUI only)
  # ===========================================================================
  appimage:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential g++ curl \
            cmake extra-cmake-modules fuse3 libfuse3-dev file wget desktop-file-utils \
            qt6-base-dev qt6-charts-dev libkf6coreaddons-dev libkf6i18n-dev libkf6xmlgui-dev \
            libkf6configwidgets-dev libkf6iconthemes-dev libkf6crash-dev libkf6kio-dev \
            libkf6notifications-dev libkf6statusnotifieritem-dev

      - name: Install rustup (trixie's rustc 1.85 is too old for let-chains and zbus 5.14)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build AppImage
        env:
          VERSION_TAG: ${{ env.VERSION }}
        run: packaging/appimage/build-appimage.sh "${VERSION_TAG#v}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: appimage
          path: ButteredDASD-*.AppImage

  # ===========================================================================
  # Snap — DISABLED until core26 (Ubuntu 26.04 LTS) becomes a snapcraft base.
  # KF6 is not packaged in Ubuntu 24.04 noble (core24), so the GUI cannot be
  # built on any currently-available snap base. Re-enable once core26 ships.
  # ===========================================================================

  # ===========================================================================
  # Flatpak (GUI only)
  # ===========================================================================
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          manifest-path: packaging/flatpak/org.theboscoclub.btrdasd-gui.yml
          bundle: ButteredDASD-GUI.flatpak

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: flatpak-bundle
          path: ButteredDASD-GUI.flatpak

  # ===========================================================================
  # Collect all artifacts and attach to GitHub Release
  # ===========================================================================
  upload-release:
    needs: [arch, debian, fedora, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          merge-multiple: true
          path: packages/

      - name: List collected packages
        run: ls -lhR packages/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: packages/*
