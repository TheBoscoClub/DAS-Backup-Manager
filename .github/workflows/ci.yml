---
# Continuous integration — builds and tests, publishes nothing.
#
# Deliberately separate from release-packages.yml, which triggers ONLY on version
# tags because it publishes artifacts. A workflow that publishes must never run on
# push-to-main; a workflow that gates correctness must.
#
# This exists because CodeQL's default setup neither builds nor tests, so the repo
# could show all-green checks over a broken build (bd DAS-Backup-Manager-b14).
#
# Actions are pinned by commit SHA, the version in a trailing comment, the same
# in release-packages.yml; Dependabot's github_actions ecosystem updates the SHA
# and the comment of both together.
#
# Every package install in the Arch jobs goes through
# .github/scripts/pacman-install.sh, which retries a bounded number of times:
# connections reset by a mirror once failed a run before any build step
# (bd DAS-Backup-Manager-ravr). A step that calls pacman directly bypasses that
# retry, and tests/test_pacman_install.sh fails if one appears.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    # Same base image as the Arch release job, so CI and the shipped package are
    # built by the same toolchain rather than two that drift independently.
    # /tmp is a noatime tmpfs, as every DAS target is mounted: the recovery-OS
    # tests read a link there, and fail under CI where none can be found.
    container:
      image: archlinux:latest
      options: --tmpfs /tmp:rw,exec,nosuid,nodev,noatime,mode=1777,size=4g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The container option above is the mount; this says so, or names why not.
      - name: /tmp is noatime
        run: |
          findmnt -no OPTIONS /tmp | grep -qw noatime || {
            echo "::error::/tmp is not mounted noatime ($(findmnt -no OPTIONS /tmp)): the recovery-OS tests would read no link"
            exit 1
          }

      - name: Install toolchain
        run: .github/scripts/pacman-install.sh base-devel rust

      - name: cargo fmt --check
        working-directory: indexer
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: indexer
        run: cargo clippy --all-targets -- -D warnings

      # The D-Bus helper (btrdasd-helper, what the GUI calls) is built only
      # with the `dbus` feature, so the steps above never compile it. zbus and
      # tokio are pure Rust: no system packages beyond the toolchain.
      - name: cargo clippy -D warnings (with the D-Bus helper)
        working-directory: indexer
        run: cargo clippy --all-targets --features dbus -- -D warnings

      # No --lib, no filtering: an integration binary's failure has been missed
      # before by a command that only printed the first result line.
      - name: cargo test
        working-directory: indexer
        run: cargo test

      - name: cargo test (with the D-Bus helper)
        working-directory: indexer
        run: cargo test --features dbus

  # The root loopback suites (indexer/tests/*_loopback.rs): scrub, subvolume
  # sync and boot archival against real BTRFS filesystems on loop devices. They
  # are #[ignore]d, so the `rust` job never runs them, and they once sat red for
  # weeks unseen (bd DAS-Backup-Manager-2kb1.8).
  #
  # On the runner VM, not in a container: they need root, loop devices, mounts,
  # device-mapper and the btrfs module, and a container can have those only if
  # it is privileged. The runner VM has passwordless sudo and its own kernel,
  # and is discarded after the run, so nothing here needs the host-side task and
  # memory bound a developer's machine gets (`.claude/rules/test-safety.md`);
  # the timeouts are the bound. The runner's preinstalled stable Rust is used,
  # with a floor check, instead of a second installer; no `curl | sh`.
  loopback:
    name: Root loopback suites — scrub, subvol sync, boot archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # btrbk is what the sync suite runs for real; dmsetup and the dm-delay
      # target are how the scrub suite makes a scrub slow enough to interrupt.
      - name: Install btrfs-progs, btrbk, dmsetup
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs btrbk dmsetup jq

      # dm-delay ships in linux-modules-extra on some kernels; the suite fails
      # on its own if it is still missing, but this says why.
      - name: Load kernel modules
        run: |
          sudo modprobe btrfs
          sudo modprobe dm_mod
          sudo modprobe dm_delay || {
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe dm_delay
          }
          grep -E '^(btrfs|dm_delay) ' /proc/modules

      # let-chains (edition 2024) need 1.88; fail here, not as a compile error.
      - name: Rust toolchain
        run: |
          rustc --version
          cargo --version
          minor=$(rustc --version | sed -E 's/^rustc [0-9]+\.([0-9]+)\..*/\1/')
          [ "$minor" -ge 88 ] || { echo "::error::rustc is older than 1.88"; exit 1; }

      # One sync test shows the bare-mountpoint trap: `btrfs subvolume list` on
      # a bare directory answers for the filesystem under it, which takes a
      # BTRFS filesystem under that directory. The runner's /var/lib is ext4,
      # so the test gets a small BTRFS of its own (the image sits outside
      # /tmp, for the job's whole life; the last step looks only at /tmp).
      - name: A BTRFS directory for the bare-mountpoint test
        run: |
          img="$RUNNER_TEMP/das-loopback-base.img"
          truncate -s 512M "$img"
          mkfs.btrfs -q "$img"
          sudo mkdir -p /var/lib/das-loopback-base
          sudo mount -o loop "$img" /var/lib/das-loopback-base
          [ "$(stat -f -c %T /var/lib/das-loopback-base)" = btrfs ]
          echo "DAS_LOOPBACK_BTRFS_BASE=/var/lib/das-loopback-base" >> "$GITHUB_ENV"

      - name: Run the loopback suites as root
        run: .github/scripts/run-root-loopback-suites.sh

      # The suites tidy up after themselves, including on a failed assertion; a
      # device left behind is a leak in a suite, so it is named. Only loops
      # backed by a temp file count: the runner image has loops of its own.
      - name: Nothing left behind
        if: always()
        run: |
          leaked=$(losetup -a | grep -E '\((/var)?/tmp/' || true)
          if [ -n "$leaked" ]; then
            echo "::error::loop devices left behind:"
            echo "$leaked"
            exit 1
          fi

  build:
    name: Build — Rust library, CLI, and Qt6 GUI
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          .github/scripts/pacman-install.sh \
            base-devel rust cmake extra-cmake-modules \
            qt6-base qt6-charts kcoreaddons ki18n kxmlgui kconfigwidgets \
            kiconthemes kcrash kio knotifications kstatusnotifieritem \
            qt6-tools jq

      # Five shell suites carry cases that need en_US.UTF-8, and under C or
      # C.UTF-8 they cannot fail: bash's regex ranges [A-Za-z] and [0-9] match
      # thousands of non-ASCII letters and digits only under a locale like it
      # (bd DAS-Backup-Manager-1bsx). The Arch container carries that locale's
      # source but never compiles it, so every suite printed "NOT RUN" and
      # passed, and CI never exercised the fix it exists to guard. This compiles
      # the locale and then measures its effect on bash, in the log: the job
      # fails here, not quietly later, if the effect the suites test is absent.
      - name: Generate the en_US.UTF-8 locale
        run: |
          set -euo pipefail
          sed -i 's/^#\(en_US\.UTF-8 UTF-8\)/\1/' /etc/locale.gen
          locale-gen
          if ! LC_ALL=en_US.UTF-8 bash -c '
              letter=$(printf "\303\251")
              digit=$(printf "\331\243")
              widened=no
              if [[ $letter =~ [A-Za-z] && $digit =~ [0-9] ]]; then
                widened=yes
              fi
              echo "en_US.UTF-8 probe: charmap $(locale charmap)," \
                "[A-Za-z] and [0-9] match non-ASCII: $widened"
              [[ $widened == yes ]]
            '; then
            echo "::error::en_US.UTF-8 is not usable:" \
              "the suites' locale cases would be skipped"
            exit 1
          fi

      # REQUIRE_ALL_SHELL_CASES: a shell suite that prints NOT RUN fails (see
      # CMakeLists.txt), so the ctest step below passes only if the locale
      # cases, and the exit suite's replays through the btrdasd this build
      # makes, ran.
      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DREQUIRE_ALL_SHELL_CASES=ON

      # No -DCMAKE_INSTALL_PREFIX above, on purpose: a default configure must
      # land on /usr, where the GUI's KDEInstallDirs puts the rest, or one
      # install is split between /usr/local and /usr (bd DAS-Backup-Manager-laj).
      # The shell-install-destdir suite below proves every destination then
      # follows the prefix.
      - name: Default install prefix is /usr
        run: grep -x 'CMAKE_INSTALL_PREFIX:PATH=/usr' build/CMakeCache.txt

      # Always via cmake — a bare `cargo build` writes to a different target dir
      # and the install step then picks up a stale binary.
      - name: Build
        run: cmake --build build

      # The shell regression suites (tests/test_*.sh) are their own step, so a
      # red one is named as such and not folded into the GUI result. Every one
      # is registered as shell-* in CMakeLists.txt; --no-tests=error makes an
      # empty selection fail rather than pass.
      - name: ctest (shell suites)
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -R '^shell-'

      # Offscreen QPA so the GUI smoke suite needs no display or session bus.
      # --output-on-failure, because a bare pass/fail count is not a diagnosis.
      # Everything that is not a shell suite: the GUI smoke suite.
      - name: ctest (GUI smoke suite)
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --no-tests=error -E '^shell-'

  shell:
    name: Shell — shellcheck
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: .github/scripts/pacman-install.sh shellcheck

      - name: shellcheck
        run: |
          shopt -s nullglob
          files=(scripts/*.sh tests/*.sh .github/scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found — failing rather than silently passing"
            exit 1
          fi
          printf 'checking %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  deny:
    name: Dependencies — cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads `cargo metadata`, so cargo comes with it. The policy,
      # including the licence allow list, is indexer/deny.toml; it checks every
      # feature, the D-Bus helper's dependencies included. The RustSec database
      # is fetched at run time, so a new advisory fails the next run on its own.
      - name: Install cargo-deny
        run: .github/scripts/pacman-install.sh cargo-deny rust

      - name: cargo deny check
        working-directory: indexer
        run: cargo deny check advisories bans licenses sources

  spelling:
    name: Spelling — codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pinned: a new dictionary release must arrive as a change to this file,
      # not as main turning red on its own. Settings live in .codespellrc.
      - name: Install codespell
        run: pipx install codespell==2.4.3

      # Tracked files only, minus bd's export. `check-hidden` in .codespellrc
      # is what makes .github/ and .claude/ part of this.
      - name: codespell
        run: |
          count=$(git ls-files -- . ':!.beads' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no tracked files listed — failing rather than silently passing"
            exit 1
          fi
          echo "checking $count files"
          git ls-files -z -- . ':!.beads' | xargs -0 codespell

  yaml:
    name: YAML — yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pinned, as codespell is. Settings live in the tracked .yamllint.
      - name: Install yamllint
        run: pipx install yamllint==1.38.0

      - name: yamllint
        run: |
          count=$(git ls-files -- '.github/*.yml' '.github/*.yaml' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no workflow files listed — failing rather than silently passing"
            exit 1
          fi
          echo "checking $count files"
          yamllint --strict .github/

  markdown:
    name: Markdown — markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the version the maintainer runs locally, so CI and the editor
      # agree. Config: .markdownlint.yaml; exclusions: .markdownlintignore.
      # Lints exactly the tracked *.md files. A glob is wrong both ways:
      # '**/*.md' skips dot-directories (.claude/rules/, .claude/docs/ were never
      # linted) and --dot reaches into .git/. markdownlint exits 0 when given no
      # files, so an empty list is refused rather than passed.
      - name: Markdown lint (markdownlint-cli pinned to the local version)
        run: |
          npm install -g --ignore-scripts markdownlint-cli@0.48.0
          markdownlint --version
          mapfile -d '' files < <(git ls-files -z -- '*.md')
          [ "${#files[@]}" -gt 0 ] || { echo "no tracked *.md found — refusing a vacuous pass" >&2; exit 1; }
          echo "linting ${#files[@]} tracked *.md files"
          markdownlint "${files[@]}"
